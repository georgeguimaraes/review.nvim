name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install test deps (mini.test, codediff.nvim, nui.nvim)
        run: make deps

      - name: Run unit tests
        run: make test

      - name: Run e2e tests
        run: make test-e2e
